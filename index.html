<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY PICKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Noto+Sans+KR:wght@400;500;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#000; --paper:#fff; --grey:#f5f5f5; --line:#e5e5e5; --muted:#707072; --accent:#fa5400;
  --display:'Oswald','Noto Sans KR',sans-serif;
  --body:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.6}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

.topbar{background:var(--grey);font-size:12px;font-weight:500;text-align:center;padding:8px 16px}

header{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{max-width:1440px;margin:0 auto;padding:0 32px;height:64px;display:flex;align-items:center;gap:32px}
.logo{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;line-height:1}
nav{display:flex;gap:28px;margin:0 auto;font-weight:500;font-size:15px}
nav a{padding:20px 0;border-bottom:2px solid transparent;white-space:nowrap}
nav a:hover{border-bottom-color:var(--ink)}
.bar .side{font-size:13px;color:var(--muted)}

.hero{background:var(--ink);color:var(--paper);padding:88px 32px 72px}
.hero-in{max-width:1440px;margin:0 auto}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(56px,13vw,200px);line-height:.92;letter-spacing:-.01em;text-transform:uppercase}
.hero p{margin-top:28px;max-width:34em;font-size:18px;color:#ccc}
.btns{margin-top:32px;display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 28px;border-radius:999px;font-weight:500;font-size:15px;background:var(--paper);color:var(--ink);transition:background .15s}
.btn:hover{background:#ccc}
.btn.ghost{background:transparent;color:var(--paper);border:1px solid #6b6b6b}
.btn.ghost:hover{border-color:var(--paper)}

section{max-width:1440px;margin:0 auto;padding:64px 32px 0}
h2{font-family:var(--display);font-weight:500;font-size:28px;margin-bottom:24px}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{position:relative;min-height:520px;display:flex;flex-direction:column;justify-content:flex-end;padding:32px;color:#fff;background-size:cover;background-position:center;overflow:hidden}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 55%)}
.tile>*{position:relative;z-index:1}
.tile h3{font-family:var(--display);font-weight:700;font-size:clamp(32px,4vw,56px);line-height:1.05;text-transform:uppercase}
.tile p{margin:6px 0 18px;font-size:15px}
.tile .btn{align-self:flex-start;background:#fff;color:#000}
.tile .btn:hover{background:#ddd}

.rail{display:flex;gap:12px;overflow-x:auto;padding-bottom:16px;scroll-snap-type:x proximity}
.card{flex:0 0 min(340px,78vw);scroll-snap-align:start}
.card .thumb{aspect-ratio:1/1;background-size:cover;background-position:center;background-color:var(--grey)}
.card b{display:block;margin-top:12px;font-weight:500;font-size:16px}
.card span{font-size:14px;color:var(--muted)}

.gb form{display:grid;gap:12px;max-width:640px}
.gb input,.gb textarea{font:inherit;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
.gb input:focus,.gb textarea:focus{outline:2px solid var(--ink);border-color:transparent}
.gb textarea{min-height:110px;resize:vertical}
.gb button{justify-self:start;border:0;cursor:pointer;background:var(--ink);color:#fff;padding:13px 28px;border-radius:999px;font:500 15px var(--body)}
.gb button:hover{background:#333}
.gb button:disabled{opacity:.5;cursor:default}
.gb .status{font-size:14px;color:var(--muted);min-height:1.4em}
.gb ul{list-style:none;margin-top:32px;max-width:640px}
.gb li{padding:18px 0;border-top:1px solid var(--line)}
.gb li b{font-weight:500}
.gb li small{color:var(--muted);margin-left:8px}
.gb li p{margin-top:4px;white-space:pre-wrap;word-break:break-word}

#cat{display:none}main.is-cat>*{display:none}main.is-cat>#cat{display:block}
.back{font-size:14px;color:var(--muted)}
#cat h2{font-size:clamp(36px,6vw,72px);font-weight:700;margin:12px 0 4px;text-transform:uppercase}
.tabs{display:flex;gap:8px;margin:20px 0}
.tabs button{border:1px solid var(--line);background:#fff;padding:8px 20px;border-radius:999px;font:500 14px var(--body);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pf{display:grid;gap:10px;max-width:640px;margin:16px 0 32px;padding:20px;background:var(--grey)}
.pf[hidden]{display:none}
.pf input,.pf textarea,.pf select{font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff;color:var(--ink)}
.pf textarea{min-height:120px}
.pf .row{display:flex;gap:8px}
.pf button,.adm button{border:0;cursor:pointer;background:var(--ink);color:#fff;padding:9px 20px;border-radius:999px;font:500 13px var(--body)}
.adm{margin-top:12px;display:flex;gap:6px}
.v-card{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.v-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px}
.v-post{max-width:720px}
.pc{border:1px solid var(--line);padding:20px}
.pc h3,.pp h3{font-weight:500;font-size:18px}
.meta{font-size:13px;color:var(--muted)}
.g{aspect-ratio:1;background-size:cover;background-position:center;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;font-weight:500}
.pp{padding:28px 0;border-top:1px solid var(--line)}
.pp p,.pc p{margin-top:8px;white-space:pre-wrap;word-break:break-word}
.pp img,.pc img{max-width:100%;margin-top:12px}

footer{margin-top:96px;background:var(--ink);color:#aaa;padding:48px 32px;font-size:13px}
.foot{max-width:1440px;margin:0 auto;display:flex;flex-wrap:wrap;gap:32px 64px;justify-content:space-between}
.foot b{display:block;color:#fff;font-size:14px;margin-bottom:10px;font-weight:500}
.foot a{display:block;padding:2px 0}.foot a:hover{color:#fff}

@media (max-width:760px){
  .bar{padding:0 16px;gap:12px;height:56px}
  .bar .side{display:none}
  nav{gap:20px;overflow-x:auto;margin:0;flex:1;justify-content:flex-end}
  .hero{padding:56px 16px 48px}
  section{padding:48px 16px 0}
  .tiles{grid-template-columns:1fr}
  .tile{min-height:380px;padding:24px}
  footer{padding:40px 16px}
}

/* ===== Apple 스타일 ===== */
:root{--display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Noto Sans KR','Apple SD Gothic Neo',sans-serif;--blue:#0066cc}
body{background:#fff;color:#1d1d1f;letter-spacing:-.01em}
.topbar{background:#f5f5f7;color:#6e6e73}
header{background:rgba(22,22,23,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:0;color:#f5f5f7}
.bar{height:48px;max-width:1100px}
.logo{font-family:var(--body);font-size:17px;font-weight:700}
nav{font-size:12px;gap:32px}
nav a{padding:14px 0;border-bottom:0;opacity:.8}
nav a:hover{opacity:1;border-bottom:0}
.bar .side{color:#a1a1a6;font-size:12px}
.hero{background:#fbfbfd;color:#1d1d1f;text-align:center;padding:72px 20px 0}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,8vw,88px);line-height:1.05;letter-spacing:-.035em;text-transform:none}
.hero p{margin:16px auto 0;color:#6e6e73;font-size:clamp(18px,2.4vw,28px);line-height:1.35;max-width:26em}
.hero .btns{justify-content:center;margin-top:24px}
.btn{font-size:17px;padding:11px 22px}
.hero .btn{background:#0071e3;color:#fff}
.hero .btn:hover{background:#0077ed}
.hero .btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.hero .btn.ghost:hover{background:rgba(0,102,204,.08)}
.hero-art{max-width:1100px;margin:56px auto 0;border-radius:28px 28px 0 0;overflow:hidden;line-height:0}
.hero-art{position:relative}
.hero-art svg{width:100%;height:auto;display:block}
.hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
section{max-width:1200px}
h2{font-family:var(--display);font-weight:700;font-size:clamp(28px,4vw,40px);letter-spacing:-.025em}
.tiles{gap:12px}
.tile{min-height:580px;justify-content:flex-start;align-items:center;text-align:center;padding:52px 24px 0;background:#f5f5f7;color:#1d1d1f;border-radius:28px}
.tile::after{display:none}
.tile:nth-child(4n+2),.tile:nth-child(4n+3){background:#000;color:#f5f5f7}
.tile h3{text-transform:none;font-size:clamp(28px,3.6vw,44px);letter-spacing:-.025em}
.tile p{font-size:19px;margin:6px 0 10px;color:inherit;opacity:.8}
.tile .lk a{color:var(--blue);font-size:19px}
.tile:nth-child(4n+2) .lk a,.tile:nth-child(4n+3) .lk a{color:#2997ff}
.tile .lk a:hover{text-decoration:underline}
.tile .vis{margin-top:auto;width:100%;height:300px;display:flex;align-items:center;justify-content:center;font-size:120px;background-size:cover;background-position:center;border-radius:20px 20px 0 0}
.card .thumb{border-radius:28px;aspect-ratio:4/5}
footer{background:#f5f5f7;color:#6e6e73;margin-top:96px}
.foot b{color:#1d1d1f}
.foot a:hover{color:#1d1d1f;text-decoration:underline}
@media (max-width:760px){
  .hero{padding:48px 16px 0}
  .tile{min-height:480px;padding:36px 16px 0}
  .tile .vis{height:240px;font-size:96px}
}
</style>
</head>
<body>

<div class="topbar" id="topbar"></div>

<header>
  <div class="bar">
    <a class="logo" href="#top" id="logo"></a>
    <nav id="nav" aria-label="주 메뉴"></nav>
    <span class="side" id="owner"></span>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="hero-in">
      <h1 id="heroTitle"></h1>
      <div class="btns">
        <a class="btn" href="#menus">둘러보기</a>
        <a class="btn ghost" href="#contact">연락하기</a>
      </div>
      <div class="hero-art"><img class="hero-photo" src="img/hero.jpg" alt="" onerror="this.remove()"><svg viewBox="0 0 1100 420" preserveAspectRatio="xMidYMax slice" role="img" aria-label="산과 해가 있는 풍경 일러스트"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd6a5"/><stop offset="1" stop-color="#fff4e6"/></linearGradient></defs><rect width="1100" height="420" fill="url(#sk)"/><circle cx="780" cy="150" r="64" fill="#ff9f6b"/><path d="M0 420V280L170 170L320 270L510 100L740 290L890 200L1100 340V420Z" fill="#6c8f7a"/><path d="M0 420V350L200 250L400 330L620 220L860 340L1100 270V420Z" fill="#3f6b57"/></svg></div>
    </div>
  </div>

  <section id="menus">
    <h2>카테고리</h2>
    <div class="tiles" id="tiles"></div>
  </section>

  <section id="latest">
    <h2>최근 업데이트</h2>

  </section>


  <section id="cat">

      <input id="ptitle" maxlength="100" placeholder="제목 (예: 가게 이름, 산 이름)" required>
      <div class="row"><input id="pplace" maxlength="60" placeholder="지역"><select id="prate" aria-label="별점"><option value="0">별점 없음</option><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select></div>
      <textarea id="pbody" maxlength="5000" placeholder="내용"></textarea>
      <input id="pimg" type="file" accept="image/*" aria-label="사진">
      <input id="ppw" type="password" autocomplete="off" placeholder="비밀번호 (글 저장·수정에 필요)" aria-label="비밀번호" required>
      <div class="row"><button type="submit" id="psave">저장</button><button type="button" id="pcancel" hidden>수정 취소</button></div>
    </form>
    <div class="status" id="pstatus" role="status"></div>
    <div id="posts"></div>
  </section>
</main>

<footer id="contact">
  <div class="foot">
    <div><b id="fname"></b><span id="fmail"></span></div>
    <div id="fmenus"><b>메뉴</b></div>
    <div id="flinks"><b>링크</b></div>
  </div>
</footer>

const bg = m => { const u = m.img || PHOTOS[m.id]; return u ? `background-image:url('${u}')` : `background:${m.color}`; };

document.title = SITE.name;
$("topbar").textContent = SITE.notice;
$("logo").textContent = SITE.name;
$("owner").textContent = SITE.owner;
$("heroTitle").textContent = SITE.heroTitle;
$("fname").textContent = SITE.name;
$("fmail").innerHTML = `<a href="mailto:${SITE.email}">${SITE.email}</a>`;

$("nav").innerHTML = MENUS.map(m => `<a href="#${m.id}">${m.name}</a>`).join("");

const ICON = { food:"🍜", mountain:"⛰️", sports:"⚽", shopping:"🛍️" };
const vis = m => `background:url('${m.img || PHOTOS[m.id] || "img/" + m.id + ".jpg"}') center/cover no-repeat,radial-gradient(circle at 50% 45%,${m.color}cc,${m.color}33 65%,transparent 80%)`;
$("tiles").innerHTML = MENUS.map(m => `
  <article class="tile" id="t-${m.id}">
    <h3>${m.title}</h3>
    <div class="lk"><a href="#${m.id}">보러가기 ›</a></div>
    <div class="vis" style="${vis(m)}"></div>
  </article>`).join("");

$("rail").innerHTML = LATEST.map(l => {
  const m = MENUS.find(x => x.id === l.menu) || MENUS[0];
  return `<a class="card" href="#${m.id}">
    <div class="thumb" style="${bg(m)}"></div>
    <b>${l.title}</b><span>${m.name} · ${l.sub}</span></a>`;
}).join("");

$("fmenus").innerHTML += MENUS.map(m => `<a href="#${m.id}">${m.name}</a>`).join("");
$("flinks").innerHTML += SITE.links.map(l => `<a href="${l.u}">${l.t}</a>`).join("");
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, where, query, orderBy, limit, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

/* 글 저장·수정·삭제용 비밀번호. 비밀번호 자체가 아니라 SHA-256 해시를 넣습니다.
   비밀번호를 바꾸려면 이 값을 새 해시로 교체하세요.
   새 해시 만드는 법: 브라우저 콘솔(F12)에 아래 한 줄을 붙여넣고 '내비밀번호'만 바꿔서 실행
   crypto.subtle.digest("SHA-256", new TextEncoder().encode("내비밀번호")).then(b => console.log([...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("")))  */
const PASSWORD_HASH = "aa9972def72e0baac8461b61ab889a9b0451bf5deba42fbe1e7af10dd77c1558";

const firebaseConfig = {
  apiKey: "AIzaSyCDp6BDhDarejmFfA092yZJ3ZLLofh5z0Q",
  authDomain: "flutter-ai-playground-de9a1.firebaseapp.com",
  projectId: "flutter-ai-playground-de9a1",
  storageBucket: "flutter-ai-playground-de9a1.firebasestorage.app",
  messagingSenderId: "200711531899",
  appId: "1:200711531899:web:4d4653fc64bc49ddeda1de"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

/* ===== 메뉴별 보기 + 비밀번호 확인 ===== */
const sha256 = async s => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)))].map(x => x.toString(16).padStart(2, "0")).join("");
const checkPw = async pw => (await sha256(pw || "")) === PASSWORD_HASH;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stars = n => n ? "★".repeat(n) + "☆".repeat(5 - n) : "";
let cat = null, mode = "card", posts = [], editing = null, unsub = null;

const shrink = f => new Promise((ok, no) => {
  const i = new Image();
  i.onload = () => {
    const w = Math.min(900, i.width), h = i.height * w / i.width, c = document.createElement("canvas");
    c.width = w; c.height = h; c.getContext("2d").drawImage(i, 0, 0, w, h);
    let q = .75, s;
    do { s = c.toDataURL("image/jpeg", q); q -= .1; } while (s.length > 380000 && q > .2);
    ok(s);
  };
  i.onerror = no; i.src = URL.createObjectURL(f);
});

function render() {
  const m = MENUS.find(x => x.id === cat); if (!m) return;
  const box = $("posts"); box.className = "v-" + mode;
  $("pstatus").textContent = posts.length ? "" : "아직 올라온 내용이 없어요.";
  const adm = p => `<div class="adm"><button data-edit="${p.id}">수정</button><button data-del="${p.id}">삭제</button></div>`;
  const meta = p => `<div class="meta">${esc(p.place)} ${stars(p.rating)}</div>`;
  box.innerHTML = posts.map(p => {
    if (mode === "gal") {
      const img = p.imageData ? `url('${p.imageData}')` : m.color;
      const bgs = p.imageData ? `background-image:linear-gradient(transparent 50%,rgba(0,0,0,.6)),${img}` : `background:linear-gradient(transparent 50%,rgba(0,0,0,.4)),${img}`;
      return `<div class="g" style="${bgs}">${esc(p.title)}<span class="meta" style="color:#ddd">${esc(p.place)}</span>${adm(p)}</div>`;
    }
    if (mode === "post") return `<article class="pp"><h3>${esc(p.title)}</h3>${meta(p)}${p.imageData ? `<img src="${p.imageData}" alt="">` : ""}<p>${esc(p.body)}</p>${adm(p)}</article>`;
    return `<article class="pc"><h3>${esc(p.title)}</h3>${meta(p)}<p>${esc((p.body || "").slice(0, 60))}</p>${adm(p)}</article>`;
  }).join("");
}

function openCat(id) {
  const m = MENUS.find(x => x.id === id); cat = id;
  $("ctitle").textContent = m.title;
  unsub && unsub(); resetForm();
  unsub = onSnapshot(query(collection(db, "posts"), where("category", "==", id)), s => {
    posts = s.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: "estimate" }) }))
      .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    render();
  }, () => { $("pstatus").textContent = "불러오지 못했어요. Firestore 규칙이 게시됐는지 확인해주세요."; });
}

function resetForm() { editing = null; $("pf").reset(); $("pcancel").hidden = true; $("psave").textContent = "저장"; }

$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.m;
  [...$("tabs").children].forEach(x => x.classList.toggle("on", x === b)); render();
});

$("posts").addEventListener("click", async e => {
  const ed = e.target.dataset.edit, del = e.target.dataset.del;
  if (ed) {
    editing = posts.find(p => p.id === ed);
    $("ptitle").value = editing.title; $("pplace").value = editing.place || "";
    $("prate").value = editing.rating || 0; $("pbody").value = editing.body || "";
    $("pcancel").hidden = false; $("psave").textContent = "수정 저장"; $("pf").scrollIntoView();
  }
  if (del && confirm("이 글을 삭제할까요?")) {
    const pw = prompt("삭제하려면 비밀번호를 입력하세요");
    if (pw === null) return;
    if (!(await checkPw(pw))) { $("pstatus").textContent = "비밀번호가 맞지 않아요."; return; }
    try { await deleteDoc(doc(db, "posts", del)); $("pstatus").textContent = ""; }
    catch { $("pstatus").textContent = "삭제하지 못했어요. Firestore 규칙을 확인해주세요."; }
  }
});
$("pcancel").onclick = resetForm;

$("pf").addEventListener("submit", async e => {
  e.preventDefault();
  if (!(await checkPw($("ppw").value))) { $("pstatus").textContent = "비밀번호가 맞지 않아요."; return; }
  $("psave").disabled = true;
  try {
    const f = $("pimg").files[0];
    const data = { category: cat, title: $("ptitle").value.trim(), place: $("pplace").value.trim(),
      rating: +$("prate").value, body: $("pbody").value.trim(),
      imageData: f ? await shrink(f) : (editing?.imageData || "") };
    if (editing) await updateDoc(doc(db, "posts", editing.id), data);
    else await addDoc(collection(db, "posts"), { ...data, createdAt: serverTimestamp() });
    resetForm(); $("pstatus").textContent = "";
  } catch { $("pstatus").textContent = "저장하지 못했어요. Firestore 규칙을 확인해주세요."; }
  finally { $("psave").disabled = false; }
});

function route() {
  const h = location.hash.slice(1), m = MENUS.find(x => x.id === h);
  document.querySelector("main").classList.toggle("is-cat", !!m);
  if (m) { openCat(m.id); scrollTo(0, 0); }
  else { unsub && unsub(); unsub = null; if (h) document.getElementById(h)?.scrollIntoView(); }
}
addEventListener("hashchange", route); route();
</script>
